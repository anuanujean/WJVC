name: Daily Biotech Digest

on:
  schedule:
    # 22:00 UTC = 07:00 KST next day
    - cron: '0 22 * * *'
  workflow_dispatch:  # allow manual trigger from GitHub UI

permissions:
  contents: write
  models: read

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate digest
        run: python biotech_digest.py
        env:
          TZ: Asia/Seoul
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push digest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add digests/
          if git diff --staged --quiet; then
            echo "No new digest to commit (no entries today)."
          else
            git commit -m "📰 Daily digest: $(TZ=Asia/Seoul date +%Y-%m-%d)"
            git push
          fi
